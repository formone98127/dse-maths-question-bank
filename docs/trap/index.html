<body>
<header class="bar">
  <a class="brand" href="/hub/">DSE Hub</a>
  <span class="mode-chip" id="modeChip" hidden></span>
  <span class="streak" id="streak" hidden>🔥 <b>0</b></span>
</header>

<!-- 起始：揀模式 -->
<section id="home" class="screen">
  <h1>伏位快問</h1>
  <p class="sub">每張卡一句數學陳述：係<strong>真</strong>定係<strong>伏</strong>？右掃＝真，左掃＝伏。答錯即刻有提示，錯咗嘅卡會再出現，直到答啱為止。</p>
  <button type="button" class="big-btn" data-mode="mixed">綜合 20 卡（推薦）</button>
  <h2>專項課題</h2>
  <div id="topicChips" class="chips"></div>
  <noscript>
    <p>此遊戲需要 JavaScript。例子：「√(x²+y²) = x+y」係伏（開方拆唔開加號）；「兩件獨立事件 P(A∩B) = P(A)×P(B)」係真。</p>
  </noscript>
</section>

<!-- 遊戲中 -->
<main id="game" class="screen" hidden>
  <div id="stackWrap">
    <div id="stack" aria-live="polite"></div>
    <div id="hintLayer" hidden>
      <p class="verdict" id="verdict"></p>
      <p class="hint" id="hintText"></p>
      <a id="srcLink" class="src-link" target="_blank" rel="noopener" hidden>做返相關真題 →</a>
    </div>
  </div>
</main>

<!-- 總結 -->
<section id="summary" class="screen" hidden>
  <h1>完成！</h1>
  <div id="sumStats" class="sum-stats"></div>
  <h2 id="weakHead" hidden>弱點課題</h2>
  <div id="weakList" class="chips"></div>
  <button type="button" class="big-btn" id="againBtn">再嚟一局</button>
  <button type="button" class="ghost-btn" id="homeBtn">揀過模式</button>
</section>

<footer class="actions" id="actions" hidden>
  <button type="button" class="ans-btn trap" id="btnTrap"><span class="mark">✗</span> 伏</button>
  <button type="button" class="ans-btn real" id="btnReal">真 <span class="mark">✓</span></button>
</footer>

<script src="cards.js"></script>
<script src="app.js"></script>
</body>
