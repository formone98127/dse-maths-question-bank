   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="42.66" y="101.422125" transform="rotate(-0 42.66 101.422125)">**SCREAMING CHILD TAX**</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(42.66 122.458359)">For the benefit of both staff and customers alike, we have taken the decision to impose a tax</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(42.66 136.210652)">on children who scream. If we notice that your child is screaming, an automatic 15%</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(42.66 149.962945)">surcharge will be applied to your bill. For every further screaming child you have in your</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(42.66 163.715238)">group, an additional 10% will be added.</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'; text-anchor: start" x="42.66" y="211.162359" transform="rotate(-0 42.66 211.162359)">We trust you understand our position.</text>
   </g>
