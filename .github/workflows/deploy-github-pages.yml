name: Deploy GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/scripts/rewrite_pages_paths.py"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard — links must not target auto-generated paper index pages
        run: |
          if grep -rEn 'href="[^"]*/(math|econ|chem|bio|phys)/[0-9]{4}/(paper-[12](-en|-zh)?)/"' docs --include='*.html' --include='*.js'; then
            echo "::error::Links point to auto-generated paper index pages — use main-reader deep links (/\#HASH) instead"
            exit 1
          fi
      - name: Rewrite root-absolute paths for project Pages
        run: python3 .github/scripts/rewrite_pages_paths.py
      - name: Publish site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-dist
          force_orphan: true
