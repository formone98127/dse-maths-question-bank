name: Deploy GitHub Pages site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/scripts/rewrite_pages_paths.py"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite root-absolute paths for project Pages
        run: python3 .github/scripts/rewrite_pages_paths.py
      - name: Publish site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./gh-pages-dist
          force_orphan: true
