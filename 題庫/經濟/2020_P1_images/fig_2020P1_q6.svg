z
" style="fill: none"/>
    </g>
    <text style="font-size: 9.5px; font-family: 'DejaVu Serif'" transform="translate(211.749281 50.730906)">I own a lake with great natural views.</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Serif'" transform="translate(191.080844 61.503906)">How can I earn income from it, Captain Cook?</text>
   </g>
   <g id="text_2">
    <g id="patch_18">
     <path d="M 268.966539 152.183609 
L 470.041461 152.183609 
L 470.041461 132.081312 
L 268.966539 132.081312 
L 268.966539 152.183609 
z
" style="fill: none"/>
    </g>
    <text style="font-size: 9.5px; font-family: 'DejaVu Serif'" transform="translate(268.966539 139.434906)">I have a fishing boat! I can be the captain</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Serif'" transform="translate(297.089508 150.207906)">of some boat trips in the lake!</text>
   </g>
   <g id="text_3">
    <g id="patch_19">
     <path d="M 139.902664 268.360148 
L 399.521336 268.360148 
L 399.521336 226.711852 
L 139.902664 226.711852 
L 139.902664 268.360148 
z
" style="fill: none"/>
    </g>
    <text style="font-size: 9.5px; font-family: 'DejaVu Serif'" transform="translate(145.98118 233.930367)">Let's organise fishing tours and charge the tourists</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Serif'" transform="translate(139.902664 244.703367)">a large sum! I will pay you a daily rate, Captain Cook.</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Serif'" transform="translate(173.145984 255.476367)">And I will pocket the remaining income.</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Serif'" transform="translate(180.004539 266.249367)">We will earn a lot of money together!</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; text-anchor: middle" x="81.216" y="228.174281" transform="rotate(-0 81.216 228.174281)">Landlord Li</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; text-anchor: middle" x="480.384" y="314.106281" transform="rotate(-0 480.384 314.106281)">Captain Cook</text>
