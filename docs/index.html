<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>DSE 題庫 · 數學與經濟</title>
<script>
/* 冇指定題目 hash 時唔好自動開第一題（唔寫 #2012P1Q1）；入口去 DSE Hub */
if (!location.hash) {
  location.replace('hub/' + (location.search || ''));
}
</script>
<script>MathJax = {tex: {inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$']]},
  startup: {ready() { MathJax.startup.defaultReady(); if (window.typesetQ) typesetQ(); }}};</script>
<script src="mathjax/tex-chtml.js" async></script>
<style>
:root { --bg:#f6f7f9; --card:#fff; --ink:#1c2733; --mut:#6b7a8c; --acc:#0b62c4; --line:#dde3ea; --sol:#c62828; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; }
body { margin:0; background:var(--bg); color:var(--ink); display:flex; flex-direction:column;
       font-family:"Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
       overscroll-behavior:none; }
header { background:var(--card); border-bottom:1px solid var(--line); padding:10px 14px; z-index:5; }
.bar { display:flex; gap:8px; align-items:center; max-width:960px; margin:0 auto; flex-wrap:wrap; }
select { flex:1; padding:9px 10px; border:1px solid var(--line); border-radius:8px;
         font-size:14.5px; background:var(--card); min-width:0; }
main { flex:1; min-height:0; display:flex; flex-direction:column; max-width:960px;
       width:100%; margin:0 auto; padding:10px 12px 0; }
.qcard { background:var(--card); border:1px solid var(--line); border-radius:12px;
         padding:14px 18px; display:flex; flex-direction:column; flex:1; min-height:0; }
.qmeta { display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap; padding-bottom:8px;
         border-bottom:1px dashed var(--line); }
.qmeta-main { flex:1; min-width:0; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
.qno { font-weight:700; font-size:17px; }
.meta { color:var(--mut); font-size:12.5px; }
.badge { font-size:11.5px; padding:2px 8px; border-radius:6px; }
.badge.qu { background:#e8f5ec; color:#177245; }
.badge.ans { background:#fdf0e3; color:#a05a00; }
.pdf-top {
  flex:0 0 auto; margin-left:auto;
  width:36px; height:36px; border-radius:10px;
  display:inline-flex; align-items:center; justify-content:center;
  color:var(--acc); background:#eef5fc; border:1px solid rgba(11,98,196,.22);
  text-decoration:none;
}
.pdf-top svg { width:18px; height:18px; fill:currentColor; }
.pdf-top:hover { filter:brightness(0.96); }
.pdf-top.disabled, .pdf-top[aria-disabled="true"] {
  color:#94a3b8; background:#f1f4f8; border-color:var(--line);
  pointer-events:none; cursor:not-allowed;
}
#qbody { flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
         font-size:15.5px; line-height:1.8; padding-top:10px; display:flex; flex-direction:column; }
#qbody .qcontent { flex:1 1 auto; }
#qbody img {
  max-width: min(100%, 640px);
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
  background:#fff;
}
#qbody table { border-collapse:collapse; width:auto; max-width:100%; margin:0.7em 0; font-size:14.5px; }
#qbody th, #qbody td { border:1px solid #8a96a5; padding:5px 10px; text-align:left; vertical-align:middle; }
#qbody th { background:#eef2f6; font-weight:700; }
#qbody .ttag { color:var(--acc); font-size:12.5px; }
#qbody .ttag-label { color:var(--mut); font-size:12.5px; margin-right:4px; }
.sol-row {
  display:flex; justify-content:flex-end; align-items:center;
  margin-top:16px; padding-top:10px; border-top:1px dashed var(--line);
}
.sol-link {
  color:var(--sol); font-weight:700; font-size:14px;
  text-decoration:none; border-bottom:1px solid rgba(198,40,40,.35);
}
.sol-link:hover { border-bottom-color:var(--sol); }
.sol-pending {
  color:var(--sol); font-weight:700; font-size:14px; opacity:.72;
}
/* MC 選項：跟 tw-gsat-question-bank 卡片掣形式（未有答案都可撳揀） */
#qbody .options { display:grid; gap:10px; margin:12px 0 4px; }
#qbody .option {
  display:flex; gap:10px; align-items:flex-start; width:100%;
  text-align:left; padding:12px 14px; min-height:44px;
  border:1px solid var(--line); border-radius:10px;
  background:var(--card); color:var(--ink); font:inherit; font-size:15.5px;
  line-height:1.45; cursor:pointer; touch-action:manipulation;
}
#qbody .option:hover { border-color:#9eb6d4; }
#qbody .option.selected {
  border-color:var(--acc); background:#eef5fc;
  box-shadow:0 0 0 2px rgba(11,98,196,.18);
}
#qbody .option .letter { flex:0 0 1.2em; font-weight:700; color:var(--acc); }
#qbody .option .opt-body { flex:1; min-width:0; }
#qbody .mc-hint { color:var(--mut); font-size:12.5px; margin:0 0 8px; }
mjx-container { overflow-x:auto; overflow-y:hidden; }
#nav { display:flex; gap:8px; align-items:center; justify-content:center; flex-wrap:wrap; padding:10px 0; }
#nav .btn { padding:8px 14px; border:1px solid var(--line); border-radius:8px;
            background:var(--card); font-size:14px; cursor:pointer; color:var(--ink); }
#nav .btn:disabled { opacity:.35; }
#pos { color:var(--mut); font-size:13px; min-width:84px; text-align:center; }
footer { text-align:center; color:var(--mut); font-size:11.5px; padding:4px 0 12px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <select id="ssubj"></select>
    <select id="syear"></select>
    <select id="spaper"></select>
    <select id="stag"><option value="">全部課題</option></select>
    <select id="sqno"></select>
  </div>
</header>

<main>
  <div class="qcard">
    <div class="qmeta">
      <div class="qmeta-main">
        <span class="qno" id="dqno"></span>
        <span class="meta" id="dmeta"></span>
        <span class="badge" id="dbadge"></span>
      </div>
      <a class="pdf-top disabled" id="pdfBtn" href="#" aria-disabled="true" title="下載全卷 PDF · 待補" aria-label="下載全卷 PDF"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a1 1 0 0 1 1 1v9.6l2.8-2.8a1 1 0 1 1 1.4 1.4l-4.5 4.5a1 1 0 0 1-1.4 0L6.8 12.2a1 1 0 1 1 1.4-1.4L11 13.6V4a1 1 0 0 1 1-1zM5 19a1 1 0 0 1 1-1h12a1 1 0 1 1 0 2H6a1 1 0 0 1-1-1z"/></svg></a>
    </div>
    <div id="qbody"></div>
  </div>
  <div id="nav">
    <button class="btn" id="prev">← 上一題</button>
    <span id="pos"></span>
    <button class="btn" id="next">下一題 →</button>
  </div>
</main>
<footer>DSE 題庫（數學 · 經濟）— 內容僅供學習用途</footer>

<script src="data.js"></script>
<script>
const QS = window.QB.questions;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const pno = p => p.match(/(\d+)/)[1];

/* 全卷 PDF → dsepaper.hk 對應檔案頁 */
const PDF_LINKS = {
  "math|2012|卷一": "https://dsepaper.hk/dse-mathematics-pastpaper-2012-paper-1-1",
  "math|2012|卷二": "https://dsepaper.hk/dse-mathematics-pastpaper-2012-paper-2-1",
  "math|2013|卷一": "https://dsepaper.hk/dse-mathematics-pastpaper-2013-paper-1-1",
  "math|2013|卷二": "https://dsepaper.hk/dse-mathematics-pastpaper-2013-paper-2-1",
  "math|2014|卷一": "https://dsepaper.hk/dse-mathematics-pastpaper-2014-paper-1-1",
  "math|2015|卷二": "https://dsepaper.hk/dse-mathematics-pastpaper-2015-paper-2-1",
  "econ|2015|卷一": "https://dsepaper.hk/dse-economics-pastpaper-2015-paper-1",
  "econ|2017|卷一": "https://dsepaper.hk/dse-economics-pastpaper-2017-paper-1",
  "econ|2020|卷一": "https://dsepaper.hk/dse-economics-pastpaper-2020-paper-1",
};
function paperKey(subject, year, paper) {
  const id = subject === '經濟' ? 'econ' : 'math';
  const zh = String(paper).includes('2') ? '卷二' : '卷一';
  return `${id}|${year}|${zh}`;
}
function syncPdfTop(q) {
  const url = q ? (PDF_LINKS[paperKey(q.subject, q.year, q.paper)] || null) : null;
  const btn = $('#pdfBtn');
  if (url) {
    btn.href = url;
    btn.target = '_blank';
    btn.rel = 'noopener';
    btn.classList.remove('disabled');
    btn.setAttribute('aria-disabled', 'false');
    btn.removeAttribute('title');
  } else {
    btn.href = '#';
    btn.removeAttribute('target');
    btn.classList.add('disabled');
    btn.setAttribute('aria-disabled', 'true');
    btn.title = '下載全卷 PDF · 待補';
  }
}

function findSolution(q) {
  if (!q) return null;
  return QS.find(x =>
    x.type === '解答' &&
    x.subject === q.subject &&
    x.year === q.year &&
    x.paper === q.paper &&
    x.qno === q.qno
  ) || null;
}
function findQuestion(q) {
  if (!q) return null;
  return QS.find(x =>
    x.type === '題目' &&
    x.subject === q.subject &&
    x.year === q.year &&
    x.paper === q.paper &&
    x.qno === q.qno
  ) || null;
}
function solFooterHtml(q) {
  if (!q) return '';
  if (q.type === '解答') {
    const qu = findQuestion(q);
    if (qu) {
      return `<div class="sol-row"><a class="sol-link" href="#${q.subject==='經濟'?'econ':''}${q.year}P${pno(q.paper)}Q${q.qno}" id="solLink">返回題目</a></div>`;
    }
    return `<div class="sol-row"><span class="sol-link">題解</span></div>`;
  }
  const sol = findSolution(q);
  if (sol) {
    const hash = `${q.subject==='經濟'?'econ':''}${q.year}P${pno(q.paper)}Q${q.qno}A`;
    return `<div class="sol-row"><a class="sol-link" href="#${hash}" id="solLink">題解</a></div>`;
  }
  return `<div class="sol-row"><span class="sol-pending">待建立題解</span></div>`;
}

let subj = null, year = null, paper = null, qno = null, tag = '';
let paperList = [];
let qlist = [];

const params = new URLSearchParams(location.search);
const wantSubj = params.get('subject') || '';
const wantTag = params.get('tag') || '';

const subjs = [...new Set(QS.map(q=>q.subject))];
subjs.forEach(s => $('#ssubj').insertAdjacentHTML('beforeend',`<option>${s}</option>`));

function fillYears() {
  const ys = [...new Set(QS.filter(q=>q.subject===subj).map(q=>q.year))].sort();
  $('#syear').innerHTML = ys.map(y=>`<option>${y}</option>`).join('');
}
function fillPapers() {
  paperList = [...new Set(QS.filter(q=>q.subject===subj && q.year==year).map(q=>q.paper))]
    .sort((a,b)=>pno(a)-pno(b));
  $('#spaper').innerHTML = paperList.map(p=>`<option>${p}</option>`).join('');
}
function fillTags() {
  const pool = QS.filter(q =>
    q.subject===subj &&
    (year == null || q.year==year) &&
    (paper == null || q.paper===paper)
  );
  const tags = [...new Set(pool.flatMap(q => q.tags || []))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  const keep = tag && tags.includes(tag) ? tag : '';
  tag = keep;
  $('#stag').innerHTML =
    `<option value="">全部課題</option>` +
    tags.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
  $('#stag').value = keep;
}
function filteredQlist() {
  return QS.filter(q =>
    q.subject===subj && q.year==year && q.paper===paper &&
    (!tag || (q.tags || []).includes(tag))
  ).sort((a,b)=>a.qno-b.qno || (a.type<b.type?-1:1));
}
function fillQnos() {
  qlist = filteredQlist();
  $('#sqno').innerHTML = qlist.length
    ? qlist.map(q =>
        `<option value="${q.qno}|${q.type}">${q.title}${q.type==='解答'?'　·解':''}</option>`).join('')
    : `<option value="">（呢個課題呢卷暫時冇題）</option>`;
}
function syncSelectors() {
  $('#ssubj').value = subj;
  fillYears(); $('#syear').value = year;
  fillPapers(); $('#spaper').value = paper;
  fillTags();
  fillQnos();
  const cur = qlist.find(q=>q.qno==qno && (!curType() || q.type===curType()));
  if (cur) $('#sqno').value = `${cur.qno}|${cur.type}`;
}
const curType = () => { const c = qlist.find(q=>q.qno==qno); return c ? c.type : null; };

function enhanceMc(root) {
  root.querySelectorAll('ul').forEach(ul => {
    const items = [...ul.children].filter(el => el.tagName === 'LI');
    if (items.length < 2) return;
    const parsed = items.map(li => {
      const raw = li.innerHTML.trim();
      const m = raw.match(/^([A-D])[.．、]\s*([\s\S]*)$/i);
      return m ? { letter: m[1].toUpperCase(), html: m[2] } : null;
    });
    if (parsed.some(p => !p)) return;
    const wrap = document.createElement('div');
    wrap.className = 'options';
    wrap.setAttribute('role', 'group');
    wrap.setAttribute('aria-label', '選項');
    const hint = document.createElement('p');
    hint.className = 'mc-hint';
    hint.textContent = '撳選項練習（答案稍後加入）';
    wrap.appendChild(hint);
    parsed.forEach(p => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option';
      btn.dataset.choice = p.letter;
      btn.innerHTML = `<span class="letter">${p.letter}</span><span class="opt-body">${p.html}</span>`;
      btn.addEventListener('click', () => {
        wrap.querySelectorAll('.option').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
      wrap.appendChild(btn);
    });
    ul.replaceWith(wrap);
  });
}

let curQ = null;
function show(q) {
  if (!q) {
    $('#dqno').textContent = `${subj||''}　${year||''} ${paper||''}`;
    $('#dmeta').textContent = tag ? `課題：${tag}` : '';
    $('#dbadge').className = 'badge';
    $('#dbadge').textContent = '';
    $('#qbody').innerHTML = '<p style="color:var(--mut)">呢組條件暫時冇題。試下改「全部課題」或者換一卷。</p>';
    $('#pos').textContent = '0 / 0';
    $('#prev').disabled = true;
    $('#next').disabled = true;
    syncPdfTop(null);
    return;
  }
  curQ = q;
  qno = q.qno;
  subj = q.subject; year = q.year; paper = q.paper;
  syncSelectors();
  $('#dqno').textContent = `${q.subject}　${q.year} ${q.paper}　${q.title}`;
  $('#dmeta').textContent = (q.tags && q.tags.length) ? `課題：${q.tags.join(' · ')}` : '';
  $('#dbadge').className = 'badge ' + (q.type==='題目'?'qu':'ans');
  $('#dbadge').textContent = q.type === '題目' ? '題目' : '解答';
  const tagsHtml = q.tags.length
    ? `<p class="ttag"><span class="ttag-label">課題</span>${q.tags.map(t=>'#'+esc(t)).join('　')}</p>`
    : '';
  $('#qbody').innerHTML =
    `<div class="qcontent">${q.html}${tagsHtml}</div>` +
    solFooterHtml(q);
  enhanceMc($('#qbody'));
  const solA = $('#solLink');
  if (solA) {
    solA.addEventListener('click', e => {
      e.preventDefault();
      const m = solA.getAttribute('href').match(/^#(econ)?(\d{4})P(\d)Q(\d+)(A)?/i);
      if (!m) return;
      const wantSol = !!m[5];
      const target = QS.find(x =>
        x.subject === (m[1] ? '經濟' : '數學') &&
        x.year == +m[2] &&
        pno(x.paper) == m[3] &&
        x.qno == +m[4] &&
        x.type === (wantSol ? '解答' : '題目')
      );
      if (target) show(target);
    });
  }
  $('#qbody').scrollTop = 0;
  const i = qlist.findIndex(x=>x===q);
  $('#pos').textContent = `${i+1} / ${qlist.length}`;
  $('#prev').disabled = i <= 0;
  $('#next').disabled = i >= qlist.length - 1;
  location.hash = `${q.subject==='經濟'?'econ':''}${q.year}P${pno(q.paper)}Q${q.qno}${q.type==='解答'?'A':''}`;
  syncPdfTop(q);
  typesetQ();
}
function typesetQ() {
  const MJ = window.MathJax;
  if (MJ?.typesetPromise) MJ.typesetPromise([$('#qbody')]).catch(()=>{});
}
function goto(y,p,n) {
  const cands = QS.filter(q=>q.subject===subj && q.year==y && q.paper===p);
  const q = cands.find(x=>x.qno==n && x.type==='題目') || cands.find(x=>x.qno==n);
  if (q) { year=y; paper=p; show(q); }
}
const step = d => {
  const i = qlist.findIndex(x=>x===curQ);
  const j = i + d;
  if (j >= 0 && j < qlist.length) show(qlist[j]);
};
$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);
$('#ssubj').addEventListener('change', e => {
  subj = e.target.value; year = paper = paperList = null; tag = '';
  fillYears(); year = +$('#syear').value;
  fillPapers(); paper = paperList[0];
  fillTags(); fillQnos(); show(qlist[0]);
});
$('#syear').addEventListener('change', e => {
  year = +e.target.value;
  paper = paperList = null; tag = '';
  fillPapers(); paper = paperList[0];
  fillTags(); fillQnos(); show(qlist[0]);
});
$('#spaper').addEventListener('change', e => {
  paper = e.target.value; tag = '';
  fillTags(); fillQnos(); show(qlist[0]);
});
$('#stag').addEventListener('change', e => {
  tag = e.target.value || '';
  fillQnos();
  show(qlist[0] || null);
});
$('#sqno').addEventListener('change', e => {
  const [n,t] = e.target.value.split('|');
  show(qlist.find(q=>q.qno==n && q.type===t) || qlist[0] || null);
});

const body = $('#qbody');
const atBottom = () => body.scrollTop + body.clientHeight >= body.scrollHeight - 6;
const atTop = () => body.scrollTop <= 2;
let tY = null, tX = null, wheelLock = 0;
body.addEventListener('touchstart', e => { tY = e.touches[0].clientY; tX = e.touches[0].clientX; }, {passive:true});
body.addEventListener('touchend', e => {
  if (tY === null) return;
  const dy = tY - e.changedTouches[0].clientY;
  const dx = Math.abs(tX - e.changedTouches[0].clientX);
  tY = null;
  if (dx > 70 || Math.abs(dy) < 55) return;
  if (dy > 0 && atBottom()) step(1);
  else if (dy < 0 && atTop()) step(-1);
});
body.addEventListener('wheel', e => {
  const now = Date.now();
  if (now - wheelLock < 450) { e.preventDefault(); return; }
  if (e.deltaY > 0 && atBottom()) { e.preventDefault(); wheelLock = now; step(1); }
  else if (e.deltaY < 0 && atTop()) { e.preventDefault(); wheelLock = now; step(-1); }
}, {passive:false});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') step(1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') step(-1);
});

function openFromHash() {
  const m = location.hash.match(/^#(econ)?(\d{4})P(\d)Q(\d+)(A)?/i);
  if (!m) return false;
  const hSubj = m[1] ? '經濟' : '數學';
  const wantSol = !!m[5];
  if (curQ && curQ.subject === hSubj && curQ.year == m[2] && pno(curQ.paper) == m[3] && curQ.qno == m[4] &&
      ((wantSol && curQ.type==='解答') || (!wantSol && curQ.type==='題目')))
    return true;
  subj = hSubj;
  year = +m[2];
  paper = m[3]==='2'?'Paper 2':'Paper 1';
  fillYears(); fillPapers(); fillTags(); fillQnos();
  const n = +m[4];
  const q = QS.find(x=>x.subject===subj && x.year==year && x.paper===paper && x.qno==n && x.type===(wantSol?'解答':'題目'))
         || qlist.find(x=>x.qno==n && x.type==='題目')
         || QS.find(x=>x.subject===subj && x.year==year && x.paper===paper && x.qno==n);
  if (q) {
    if (tag && !(q.tags||[]).includes(tag)) tag = '';
    show(q);
  }
  return !!q;
}
window.addEventListener('hashchange', openFromHash);

/* 冇 hash：head 已轉去 hub/，唔好再 show 第一題寫入 #2012P1Q1 */
if (!location.hash) {
  /* redirect already issued in <head> */
} else if (openFromHash()) {
  /* deep link opened */
} else {
  if (wantSubj && subjs.includes(wantSubj)) subj = wantSubj;
  else subj = subjs[0];
  fillYears();
  year = +$('#syear').value;
  fillPapers();
  paper = paperList[0];
  tag = wantTag || '';
  fillTags();
  if (wantTag && $('#stag').querySelector(`option[value="${CSS.escape(wantTag)}"]`)) {
    tag = wantTag;
    $('#stag').value = wantTag;
  }
  fillQnos();
  if (tag) {
    const hit = QS.find(q => q.subject===subj && (q.tags||[]).includes(tag) && q.type==='題目')
             || QS.find(q => q.subject===subj && (q.tags||[]).includes(tag));
    if (hit) {
      year = hit.year; paper = hit.paper;
      fillYears(); fillPapers(); fillTags(); fillQnos();
      show(hit);
    } else show(qlist[0] || null);
  } else show(qlist[0] || null);
}
