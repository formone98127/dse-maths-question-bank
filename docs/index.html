<script>
const QS = window.QB.questions;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const pno = p => {
  const m = String(p || '').match(/(\d+[A-Za-z]?)/);
  return m ? m[1].toUpperCase() : '1';
};
const YEAR_LABEL = { PP: '練習卷', SP: '樣本試卷' };
const yLabel = y => YEAR_LABEL[y] || y;
const yNum = y => { const n = Number(y); return Number.isFinite(n) ? n : 0; };
const SUBJECT_PREFIX = { '數學': '', '經濟': 'econ', '化學': 'chem', '生物': 'bio', '物理': 'phys', '英語': 'eng' };
const PREFIX_SUBJECT = { econ: '經濟', chem: '化學', bio: '生物', phys: '物理', eng: '英語' };

/* 全卷 PDF → 本站直連檔（撳掣即下載，唔跳 dsepaper.hk 頁） */
const PDF_LINKS = {
  "math|2012|卷一": "papers/math-2012-p1.pdf",
  "math|2012|卷二": "papers/math-2012-p2.pdf",
  "math|2013|卷一": "papers/math-2013-p1.pdf",
  "math|2013|卷二": "papers/math-2013-p2.pdf",
  "math|2014|卷一": "papers/math-2014-p1.pdf",
  "math|2015|卷二": "papers/math-2015-p2.pdf",
  "econ|2015|卷一": "papers/econ-2015-p1.pdf",
  "econ|2017|卷一": "papers/econ-2017-p1.pdf",
  "econ|2020|卷一": "papers/econ-2020-p1.pdf",
};
function paperKey(subject, year, paper) {
  const id = SUBJECT_PREFIX[subject] || (subject === '經濟' ? 'econ' : 'math');
  const sid = id || 'math';
  const p = String(paper || '');
  let zh = '卷一';
  if (/1A|甲/i.test(p)) zh = '卷一甲';
  else if (/1B|乙/i.test(p) && !/2/.test(p)) zh = '卷一乙';
  else if (/2/.test(p)) zh = '卷二';
  return `${sid}|${year}|${zh}`;
}
/* 由 window.PAPERS 找該卷 PDF（CASE 2 卷都由這裡提供「全卷下載」） */
const SUBJ_SID = { '數學': 'math', '數學（必修部分）': 'math', '經濟': 'econ', '化學': 'chem',
                   '生物': 'bio', '物理': 'phys', '英語': 'eng', '英文': 'eng', '中文': 'chi',
                   '企業、會計與財務概論': 'bafs', '地理': 'geog', '歷史': 'hist',
                   '中國歷史': 'chist', '資訊及通訊科技': 'ict', '旅遊與款待': 'toursm' };
function papersPdfFor(q) {

  const isEn = /英文|_EN|\(EN\)|ENG/i.test(String(q.file || ''));
  const items = (subj.items || []).filter((it) => it.k === 'paper' && String(it.y) === String(q.year));
  const exact = items.filter((it) => pTok && String(it.p || '').toUpperCase() === pTok.toUpperCase());
  const anyLang = (arr) => arr.find((it) => it.l === (isEn ? 'en' : 'zh')) || arr[0];

function findSolution(q) {
  if (!q) return null;
  /* 解答 entry 由 MS 匯入時 year／qno 係 number，題目係 string，
     用 === 會永遠配唔到（題解鍵因此長期唔出）。一律轉字串比較。 */
  const y = String(q.year), p = String(q.paper), n = String(q.qno);
  return QS.find(x =>
    x.type === '解答' &&
    x.subject === q.subject &&
    String(x.year) === y &&
    String(x.paper) === p &&
    String(x.qno) === n
  ) || null;
}
function findQuestion(q) {
  if (!q) return null;
  return QS.find(x =>
    x.type === '題目' &&
    x.subject === q.subject &&
    x.year === q.year &&
    x.paper === q.paper &&
    x.qno === q.qno
  ) || null;
}
function hashFor(q, withSol) {
  if (!q) return '';
  const pref = SUBJECT_PREFIX[q.subject] ?? (q.subject === '經濟' ? 'econ' : '');
  const base = `${pref}${q.year}P${pno(q.paper)}Q${q.qno}`;
  return withSol ? `${base}A` : base;
}
/* 題目底下嵌入對應題解；撳掣展開／收起（唔跳去另一頁） */
function solExpandHtml(q, expanded) {
  if (!q) return '';

  const sol = findSolution(q);

  if (!sol && !rep) {

  }

          <span class="sol-toggle-label">${open ? '收起題解' : '題解'}</span>

    <div class="sol-panel${open ? ' open' : ''}" id="solPanel" data-expanded="${open ? 'true' : 'false'}">

        <div class="sol-content">${sol.html}</div>

      ${rep ? `<div class="rep-body" id="repBody" hidden>${rep}</div>` : ''}
    </div>`;
}
/* 考評局對本題嘅評語（data.js 的 report 欄；已按段落分開） */
function reportHtml(q) {
  const t = (q && q.report) || '';
  const pct = (q && q.answer_pct != null) ? `<p class="mc-pct mc-pct-rep">考生答對率 <strong>${q.answer_pct}%</strong></p>` : '';
  if (!t.trim()) return pct;
  const body = t.split(/\n{2,}/).filter(Boolean)
          .map(x => `<p>${x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>`)
          .join('');
  return pct + body;
}
function scrollSolIntoView(panel) {

  qb.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });

function wireSolToggle(q) {

let subj = null, year = null, paper = null, qno = null, tag = '';
let qlist = [];

/* ===== 深度分析面板（docs/analysis/<sid>/<year>/<paper>/q<qno>.json）===== */
const AI_SID = { '數學':'math', '經濟':'econ', '化學':'chem', '生物':'bio', '物理':'phys' };
const AI_CAT_ZH = { 'Conceptual':'概念錯誤', 'Calculation':'計算粗心', 'Reading-Formatting':'審題不清', 'Methodological':'策略錯誤' };
const AI_CACHE = new Map();   /* path → payload｜null（無分析） */
let aiToken = 0;

function isMcQuestion(q) {
  if (!q || !q.text) return false;
  const letters = new Set([...String(q.text).matchAll(/^- ([A-D])[.．、]/gm)].map(m => m[1]));
  return letters.size === 4;
}
function analysisPath(q) {

function renderAi(data) {

     <div class="ai-oa" id="aiOa" hidden></div>` +

  /* 三層提示：順序解鎖 */

      if (v.is_correct === true) correct = L;
      const bits = [];
      if (v.error_category) bits.push(`<span class="ai-oa-cat">${esc(AI_CAT_ZH[v.error_category] || v.error_category)}</span>`);

function wireAiPanel(q) {
  const panel = $('#aiPanel');
  if (!panel) return;
  const path = analysisPath(q);
  const token = ++aiToken;
  const showPanel = (data) => {
    if (token !== aiToken || curQ !== q) return;
    if (!data) { panel.remove(); return; }
    panel.style.display = '';
    renderAi(data);
    const rowBtn = $('#aiToggle');
    if (rowBtn) rowBtn.style.display = '';
    const toggle = $('#aiToggle');
    const bodyEl = $('#aiBody');
    if (toggle && bodyEl) {
      toggle.addEventListener('click', () => {

        if (label) label.textContent = open ? '收起分析' : '深度分析';
        if (open) typesetAi();
      });
    }
  };
  let payload = AI_CACHE.get(path);
  if (payload === undefined) {
    /* 預先 fetch；未返到嚟之前面板維持隱形 */
    fetch(path)
      .then(r => (r.ok ? r.json() : null))
      .then(j => {
        const data = j && j.analysis ? j : null;
        AI_CACHE.set(path, data);
        showPanel(data);
      })
      .catch(() => { AI_CACHE.set(path, null); showPanel(null); });
    return;
  }
  showPanel(payload);
}

const params = new URLSearchParams(location.search);
const wantSubj = params.get('subject') || '';
const wantTag = params.get('tag') || '';
/* ?lang=en|zh（或 中文|英文）：中英卷同 hash 時用語言過濾（英文卷檔名含 英文/_EN/EN） */
const wantLang = (params.get('lang') || '').toLowerCase();
const langIsEn = wantLang === 'en' || wantLang === '英文';
const langIsZh = wantLang === 'zh' || wantLang === '中文';
const langOfQ = q => {
  const f = String(q.file || '');
  if (/英文|_EN|(EN)/i.test(f)) return 'en';
  if (/中文|CHI/.test(f)) return 'zh';
  return (String(q.text || '').match(/[一-鿿]/g) || []).length > 8 ? 'zh' : 'en';
};
const subjs = [...new Set(QS.map(q => q.subject))];

/* 題目頁唔再揀科目／年份／題號；由 Hub／網址決定，用上一題下一題翻 */
function qKey(q) {
  /* 課題模式跨年卷：唔可以淨用 qno（唔同年都會撞） */
  if (year == null || paper == null || tag) {
    return `${q.year}|${q.paper}|${q.qno}`;
  }
  return String(q.qno);
}
function rebuildQlist() {
  const langWanted = langIsEn ? 'en' : langIsZh ? 'zh' : null;
  const pool = QS.filter(q =>
    q.subject === subj &&
    (year == null || q.year == year) &&
    (paper == null || q.paper === paper) &&
    (!tag || (q.tags || []).includes(tag)) &&
    (!langWanted || q.type !== '題目' || langOfQ(q) === langWanted)
  );
  const byQ = new Map();
  for (const q of pool) {
    const k = qKey(q);
    const prev = byQ.get(k);
    if (!prev) byQ.set(k, q);
    else if (prev.type === '解答' && q.type === '題目') byQ.set(k, q);
  }
  qlist = [...byQ.values()].sort((a, b) =>
    (tag || year == null)
      ? (yNum(a.year) - yNum(b.year) || String(a.paper).localeCompare(String(b.paper)) || a.qno - b.qno)
      : (a.qno - b.qno)
  );
}
/* 甲部(1) 第 7 題 → 甲(1)；乙部 第 15 題 → 乙；無分部就唔加 */
function shortSection(title) {
  if (!title) return '';
  let m = String(title).match(/^([甲乙丙])部(\([^)]+\))/);
  if (m) return m[1] + m[2];
  m = String(title).match(/^([甲乙丙])部(?=\s|$|第)/);
  if (m) return m[1];
  return '';
}
/* 頂欄：數學 2012 Paper 1 甲(1) Q7 */
function paperBarLabel(q) {
  if (!q) return 'DSE 題庫';
  const sec = shortSection(q.title);
  const base = sec
    ? `${q.subject} ${yLabel(q.year)} ${q.paper} ${sec}`
    : `${q.subject} ${yLabel(q.year)} ${q.paper}`;
  return q.qno != null ? `${base} Q${q.qno}` : base;
}
function syncBarTitle(q) {
  const el = $('#barTitle');
  if (!el) return;
  if (!q) {
    el.textContent = tag ? `課題：${tag}` : 'DSE 題庫';
    return;
  }
  el.textContent = paperBarLabel(q);
}

function enhanceMc(root) {
  const ans = curQ && curQ.answer ? String(curQ.answer).toUpperCase() : '';
  const pct = (curQ && curQ.answer_pct != null) ? curQ.answer_pct : null;
  root.querySelectorAll('ul').forEach(ul => {
    const items = [...ul.children].filter(el => el.tagName === 'LI');
    if (items.length < 2) return;
    const parsed = items.map(li => {
      const raw = li.innerHTML.trim();
      const m = raw.match(/^([A-D])[.．、]\s*([\s\S]*)$/i);
      return m ? { letter: m[1].toUpperCase(), html: m[2] } : null;
    });
    if (parsed.some(p => !p)) return;
    const wrap = document.createElement('div');
    wrap.className = 'options';
    wrap.setAttribute('role', 'group');
    wrap.setAttribute('aria-label', '選項');
    const hint = document.createElement('p');
    hint.className = 'mc-hint';
    hint.textContent = ans ? '撳選項練習' : '撳選項練習（答案稍後加入）';
    wrap.appendChild(hint);
    const feedback = document.createElement('p');
    feedback.className = 'mc-feedback';
    feedback.hidden = true;
    parsed.forEach(p => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'option';
      btn.dataset.choice = p.letter;
      btn.innerHTML = `<span class="letter">${p.letter}</span><span class="opt-body">${p.html}</span>`;
      btn.addEventListener('click', () => {
        wrap.querySelectorAll('.option').forEach(b => {
          b.classList.remove('selected', 'correct', 'wrong');
        });
        btn.classList.add('selected');
        if (!ans) return;
        const ok = p.letter === ans;
        const rate = (pct != null) ? `（答對率 ${pct}%）` : '';
        feedback.hidden = false;
        if (ok) {
          /* 答對先至標正確答案；答錯只話你知錯，唔可以透漏邊個先啱 */
          btn.classList.add('correct');
          feedback.className = 'mc-feedback ok';
          feedback.textContent = `正確！答案是 ${ans}${rate}`;
        } else {
          btn.classList.add('wrong');
          feedback.className = 'mc-feedback bad';
          feedback.textContent = `唔啱，再試一次。${rate}`;
        }
      });
      wrap.appendChild(btn);
    });
    wrap.appendChild(feedback);
    ul.replaceWith(wrap);
  });
}

let curQ = null;
function show(q, opts) {
  opts = opts || {};
  if (!q) {
    syncBarTitle(null);
    $('#qbody').innerHTML = '<p style="color:var(--mut)">呢組條件暫時冇題。返主頁再揀一卷。</p>';
    fillPosSelect(-1);
    $('#prev').disabled = true;
    $('#next').disabled = true;
    syncPdfTop(null);
    return;
  }
  /* 若深連結落喺解答、但已有對應題目 → 改顯示題目＋展開題解 */
  if (q.type === '解答') {
    const qu = findQuestion(q);
    if (qu) return show(qu, { expandSol: true });
  }
  curQ = q;
  qno = q.qno;
  subj = q.subject;
  /* 課題模式：唔鎖死年份／卷別，上一題下一題喺同標籤題入面翻 */
  if (tag) {
    year = null;
    paper = null;
  } else {
    year = q.year;
    paper = q.paper;
  }
  rebuildQlist();
  syncBarTitle(q);
  const tagsHtml = (q.tags && q.tags.length)
    ? `<p class="ttag"><span class="ttag-label">課題</span>${q.tags.map(t=>'#'+esc(t)).join('　')}</p>`
    : '';
  /* MC 答案接駁：answers.js（官方答案表）→ q.answer（冇先至填） */
  if (!q.answer && window.ANS) {
    const table = (window.ANS[q.subject] || {})[String(q.year)];
    const file = (q.file || '') + ' ' + (q.section || '');
    const lg = /ENG|英文/i.test(file) ? 'en' : 'zh';
    if (table && /卷二|Paper 2/i.test(q.paper || '')) {
      const key = table[lg] ? lg : Object.keys(table)[0];
      if (key) q.answer = table[key][String(q.qno)] || q.answer;
    }
  }
  const expandSol = !!opts.expandSol && !!findSolution(q);
  /* Paper 2（MC）：顯示官方考評報告的考生答對率 */
  const pctHtml = (isMcQuestion(q) && q.answer_pct != null)
    ? `<p class="mc-pct" title="來自考評局考評報告／評卷參考">考生答對率 <strong>${q.answer_pct}%</strong></p>`
    : '';
  $('#qbody').innerHTML =
    `<div class="qcontent">${pctHtml}${q.html}${tagsHtml}</div>` +
    solExpandHtml(q, expandSol) +
    aiExpandHtml(q);
  const qcontent = $('#qbody .qcontent');
  if (qcontent) enhanceMc(qcontent);
  const solContent = $('#qbody .sol-content');
  if (solContent) enhanceMc(solContent);
  wireSolToggle(q);
  wireAiPanel(q);
  $('#qbody').scrollTop = 0;
  const i = qlist.findIndex(x => x.year === q.year && x.paper === q.paper && x.qno === q.qno && x.type === q.type);
  fillPosSelect(i);
  $('#prev').disabled = i <= 0;
  $('#next').disabled = i >= qlist.length - 1;
  history.replaceState(null, '', location.pathname + location.search + '#' + hashFor(q, expandSol || q.type === '解答'));
  syncPdfTop(q);
  const MJ = window.MathJax;
  const done = () => { if (expandSol) scrollSolIntoView($('#solPanel')); };
  if (MJ?.typesetPromise) MJ.typesetPromise([$('#qbody')]).then(done).catch(done);
  else { typesetQ(); if (expandSol) requestAnimationFrame(done); }
}
/* 中間 xx / yy 可撳：開下拉直接跳去嗰題 */
function fillPosSelect(idx) {
  const sel = $('#pos');
  const n = qlist.length;
  if (!n) {
    sel.innerHTML = '<option value="">0 / 0</option>';
    sel.disabled = true;
    return;
  }
  const cur = (idx >= 0 && idx < n) ? idx : 0;
  sel.disabled = false;
  sel.innerHTML = qlist.map((q, i) => {
    const isPassage = q.type === '篇章';
    const label = tag
      ? `${i + 1} / ${n}　${yLabel(q.year)} P${pno(q.paper)} ${isPassage ? (q.ref || q.title || '篇章') : 'Q' + q.qno}`
      : `${i + 1} / ${n}　${isPassage ? (q.title || '篇章') : `第 ${q.qno} 題`}`;
    return `<option value="${i}"${i === cur ? ' selected' : ''}>${esc(label)}</option>`;
  }).join('');
}
function typesetQ() {
  const MJ = window.MathJax;
  if (MJ?.typesetPromise) MJ.typesetPromise([$('#qbody')]).catch(()=>{});
}
const step = d => {
  if (!curQ) return;
  const i = qlist.findIndex(x => x.year === curQ.year && x.paper === curQ.paper && x.qno === curQ.qno && x.type === curQ.type);
  const j = i + d;
  if (j >= 0 && j < qlist.length) show(qlist[j]);
};
$('#prev').onclick = () => step(-1);
$('#next').onclick = () => step(1);
$('#pos').onchange = () => {
  const i = +$('#pos').value;
  if (Number.isFinite(i) && i >= 0 && i < qlist.length) show(qlist[i]);
};

const body = $('#qbody');
const atBottom = () => body.scrollTop + body.clientHeight >= body.scrollHeight - 6;
const atTop = () => body.scrollTop <= 2;
let tY = null, tX = null, wheelLock = 0;
body.addEventListener('touchstart', e => { tY = e.touches[0].clientY; tX = e.touches[0].clientX; }, {passive:true});
body.addEventListener('touchend', e => {
  if (tY === null) return;
  const dy = tY - e.changedTouches[0].clientY;
  const dx = Math.abs(tX - e.changedTouches[0].clientX);
  tY = null;
  if (dx > 70 || Math.abs(dy) < 55) return;
  if (dy > 0 && atBottom()) step(1);
  else if (dy < 0 && atTop()) step(-1);
});
body.addEventListener('wheel', e => {
  const now = Date.now();
  if (now - wheelLock < 450) { e.preventDefault(); return; }
  if (e.deltaY > 0 && atBottom()) { e.preventDefault(); wheelLock = now; step(1); }
  else if (e.deltaY < 0 && atTop()) { e.preventDefault(); wheelLock = now; step(-1); }
}, {passive:false});
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown') step(1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') step(-1);
});

function openFromHash() {
  const m = location.hash.match(/^#(econ|chem|bio|phys|eng)?(\d{4}|PP|SP)P(\d+[A-Za-z]?)(?:Q(\d+)|T(\d+))(A)?/i);
  if (!m) return false;
  const hSubj = m[1] ? (PREFIX_SUBJECT[m[1].toLowerCase()] || '數學') : '數學';
  const passageRef = m[5] ? 'T' + m[5] : null;
  const wantSol = !!m[6];
  const panel = $('#solPanel');
  const pToken = String(m[3]).toUpperCase();
  if (curQ && curQ.subject === hSubj && curQ.year == m[2] && pno(curQ.paper) == pToken
      && (passageRef ? curQ.ref === passageRef : curQ.qno == m[4])) {
    const expanded = panel && panel.dataset.expanded === 'true';
    if (wantSol === expanded || (wantSol && curQ.type === '解答')) return true;
  }
  subj = hSubj;
  const y = /^\d{4}$/.test(m[2]) ? +m[2] : m[2].toUpperCase();
  const p = pToken === '2' ? 'Paper 2'
    : pToken === '1A' ? 'Paper 1A'
    : pToken === '1B' ? 'Paper 1B'
    : 'Paper 1';
  const n = m[4] ? +m[4] : null;
  const ref = passageRef;
  /* 課題深連結：保留 tag，上一題下一題喺同課題集中溫習 */
  if (wantTag) {
    tag = wantTag;
    year = null;
    paper = null;
  } else {
    tag = '';
    year = y;
    paper = p;
  }
  rebuildQlist();
  /* 中英同題：?lang=en 要揀英文嗰份，唔好永遠攞第一條 */
  const langOk = (x) => (!langIsEn && !langIsZh) ? true
    : (x.type !== '題目' || langOfQ(x) === (langIsEn ? 'en' : 'zh'));
  const candQ = QS.filter(x => x.subject===subj && x.year==y && x.paper==p
    && (n != null ? x.qno==n : x.ref===ref) && (n != null ? x.type==='題目' : x.type==='篇章'));
  const qu = candQ.find(langOk) || candQ[0];
  const sol = n != null
    ? QS.find(x => x.subject===subj && x.year==y && x.paper==p && x.qno==n && x.type==='解答')
    : null;
  const q = qu || sol || qlist.find(x => x.year==y && x.paper===p && (n != null ? x.qno==n : x.ref===ref)) ||
            QS.find(x => x.subject===subj && x.year==y && x.paper===p
                        && (n != null ? x.qno==n : x.ref===ref));
  if (q) show(q, { expandSol: wantSol });
  return !!q;
}
window.addEventListener('hashchange', openFromHash);

/* 冇 hash：head 已轉去 hub/（除非 ?subject / ?tag 課題深連結） */
/* 化學／經濟／生物／物理 只上咗卷頁索引，題目內容未入庫：
   唔好靜靜跌落數學空白頁，要講清楚同帶去卷頁。 */
const SUBJECT_LANDING = { '化學': '/chem/', '經濟': '/econ/', '生物': '/bio/', '物理': '/phys/' };
function showSubjectNotInBank(name) {
  show(null);
  const land = SUBJECT_LANDING[name];
  const hub = `/hub/?subject=${encodeURIComponent({ '化學': 'chem', '經濟': 'econ', '生物': 'bio', '物理': 'phys' }[name] || 'math')}&mode=year`;
  $('#qbody').innerHTML = `<div style="padding:18px 6px;line-height:1.8">
      <p><strong>${name} 題目內容尚未收錄。</strong></p>
      <p style="color:var(--mut)">題庫目前只有數學必修部分嘅逐題內容；${name} 暫時提供歷屆試卷索引。</p>
      <p>${land ? `<a class="btn" href="${land}">睇 ${name} 歷屆試卷索引</a> ` : ''}<a class="btn" href="${hub}">去 DSE Hub 揀卷</a></p>
    </div>`;
}
if (!location.hash) {
  if (wantSubj || wantTag) {
    if (wantSubj && !subjs.includes(wantSubj)) {
      showSubjectNotInBank(wantSubj);
    } else {
    if (wantSubj && subjs.includes(wantSubj)) subj = wantSubj;
    else subj = subjs[0];
    tag = wantTag || '';
    year = paper = null;
    rebuildQlist();
    if (tag) {
      const hit = QS.find(q => q.subject===subj && (q.tags||[]).includes(tag) && q.type==='題目')
               || QS.find(q => q.subject===subj && (q.tags||[]).includes(tag));
      if (hit) show(hit);
      else show(qlist[0] || null);
    } else {
      const first = QS.find(q => q.subject===subj && q.type==='題目') || QS.find(q => q.subject===subj);
      if (first) {
        year = first.year; paper = first.paper;
        rebuildQlist();
        show(first);
      } else show(null);
    }
    }
  }
} else {
  if (!openFromHash()) {
    // #chem… / #econ… / #bio… / #phys… 屬於未入庫科目，唔好跌返數學空白頁
    const pre = (location.hash || '').replace('#', '').match(/^(chem|econ|bio|phys)/i);
    const byPrefix = { chem: '化學', econ: '經濟', bio: '生物', phys: '物理' };
    const name = (wantSubj && !subjs.includes(wantSubj)) ? wantSubj : (pre ? byPrefix[pre[1].toLowerCase()] : '');
    if (name && !subjs.includes(name)) showSubjectNotInBank(name);
  }
}
</script>

<script>
/* 圖片點擊放大 */
(function(){
  const Z=document.createElement('div');
  Z.id='imgzoom';
  Z.innerHTML='<button class="xz" aria-label="關閉">✕ 關閉</button>';
  document.body.appendChild(Z);
  Z.addEventListener('click',()=>Z.classList.remove('open'));
  document.addEventListener('click',e=>{
    const im=e.target.closest('#qbody img');
    if(!im) return;
    e.preventDefault();
    Z.querySelectorAll('img').forEach(x=>x.remove());
    const big=new Image();
    big.src=im.currentSrc||im.src;
    Z.appendChild(big);
    Z.classList.add('open');
  });
})();
</script>

<script>
(function(){
  /* ⬇️ 開好 Telegram bot 後填 username（@ 後面嗰段），例如 "dse_feedback_bot" */
  const FB_BOT = "dsehub_feedback_bot";

  const btn = document.getElementById('fbBtn');
  const modal = document.getElementById('fbModal');
  if (!FB_BOT) return;              // 未設定 bot 之前唔顯示
  btn.style.display = 'block';

  let cat = '';
  const send = modal.querySelector('.fb-send');
  modal.querySelectorAll('.fb-cats button').forEach(b => {
    b.addEventListener('click', () => {
      modal.querySelectorAll('.fb-cats button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      cat = b.dataset.cat;
      send.disabled = false;
    });
  });
  const close = () => { modal.classList.remove('open'); cat = ''; send.disabled = true; };
  modal.querySelector('.fb-cancel').addEventListener('click', close);
  modal.addEventListener('click', e => { if (e.target === modal) close(); });
  btn.addEventListener('click', () => modal.classList.add('open'));
  send.addEventListener('click', () => {
    const q = window.curQ || null;
    const ref = q ? `${q.subject || ''} ${q.year || ''} ${q.paper || ''} Q${q.qno ?? ''}` : document.title;
    const url = location.origin + location.pathname + location.hash;
    const note = (document.getElementById('fbText').value || '').trim();
    const text = `⚠ 題庫回報\n類別：${cat || '其他'}\n位置：${ref}\n頁面：${url}\n說明：${note || '（無補充）'}`;
    window.open(`https://t.me/${FB_BOT}?text=${encodeURIComponent(text)}`, '_blank');
    close();
    document.getElementById('fbText').value = '';
  });
})();
</script>
