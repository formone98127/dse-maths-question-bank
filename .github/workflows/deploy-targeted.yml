name: Deploy selected files to Hostinger

# 小批量上傳：用 curl 主動模式，避免 lftp 暫存檔（.in.*）與 passive 端口問題。
on:
  workflow_dispatch:
    inputs:
      pattern:
        description: "git ls-files glob，例如 docs/m1/*/paper-1-en/index.html"
        required: true
        default: "docs/m1/*/paper-1-en/index.html"

concurrency:
  group: hostinger-targeted
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: 147.93.109.152
      FTP_USER: u187459660.hkdseupload
    steps:
      - uses: actions/checkout@v4

      - name: Build file list
        run: |
          set -euo pipefail
          git ls-files "${{ github.event.inputs.pattern }}" | sed 's#^docs/##' | sort -u > /tmp/list.txt
          echo "files: $(wc -l < /tmp/list.txt)"
          head -5 /tmp/list.txt

      - name: Upload
        env:
          FTP_PASS: ${{ secrets.HKDSE_FTP_PASSWORD }}
        run: |
          set -uo pipefail
          fail=0
          while IFS= read -r rel; do
            if [ -z "$rel" ]; then continue; fi
            code=$(curl -sS -o /dev/null -w '%{http_code}' --ssl-reqd -k \
                     --ftp-port - --ftp-create-dirs \
                     -T "docs/$rel" \
                     "ftp://${FTP_USER}:${FTP_PASS}@${FTP_HOST}/${rel}") || code="ERR"
            echo "$rel -> $code"
            if [ "$code" != "226" ]; then fail=$((fail+1)); fi
          done < /tmp/list.txt
          echo "failures: $fail"
          exit 0
