<!doctype html>
<html
  lang="zh-HK"
  data-composition-variables='[
    {"id":"seriesTitle","type":"string","label":"Series title","default":"DSE 數學｜知識星圖"},
    {"id":"episode","type":"string","label":"Episode","default":"EP.00 宏觀導論"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #0b1220;
        --ink: #f5f7fa;
        --font-display: "Microsoft JhengHei", "Noto Sans JP", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="star-map"
        class="clip"
        data-composition-id="star-map"
        data-composition-src="compositions/star-map.html"
        data-start="0"
        data-duration="60"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <audio
        id="vo"
        class="clip"
        data-start="0"
        data-duration="58.832"
        data-track-index="10"
        src="assets/vo-min1.m4a"
        data-volume="1"
        data-fade-in="0.05"
        data-fade-out="0.2"
      ></audio>

      <audio
        id="sfx-sparkle"
        class="clip"
        data-start="0.4"
        data-duration="2.2"
        data-track-index="11"
        src="assets/sfx/sparkle.mp3"
        data-volume="0.35"
      ></audio>
      <audio
        id="sfx-pop-title"
        class="clip"
        data-start="3.05"
        data-duration="1.2"
        data-track-index="11"
        src="assets/sfx/pop.mp3"
        data-volume="0.4"
      ></audio>
      <audio
        id="sfx-whoosh-pillars"
        class="clip"
        data-start="19.9"
        data-duration="1.4"
        data-track-index="11"
        src="assets/sfx/whoosh-short.mp3"
        data-volume="0.45"
      ></audio>
      <audio
        id="sfx-whoosh-split"
        class="clip"
        data-start="39.1"
        data-duration="1.8"
        data-track-index="11"
        src="assets/sfx/whoosh.mp3"
        data-volume="0.5"
      ></audio>
      <audio
        id="sfx-chime-algebra"
        class="clip"
        data-start="46.1"
        data-duration="2"
        data-track-index="11"
        src="assets/sfx/chime.mp3"
        data-volume="0.38"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
