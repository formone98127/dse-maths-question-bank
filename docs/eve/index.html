<body>
<header class="bar">
  <a class="brand" href="/hub/">DSE Hub</a>
  <span class="day-chip" id="dayChip" hidden>距離開考還有 <b id="dayNum">15</b> 日</span>
  <span class="best" id="bestChip" hidden>最遠 <b id="bestNum">0</b> 日</span>
</header>

<section id="home" class="screen">
  <div class="lamp" aria-hidden="true"></div>
  <h1>開考倒數</h1>
  <p class="sub">距離開考還有 <strong>15 日</strong>。左右滑卡，撐住腦力、時間、分數、心情。信錯一句，考試局會遲啲嚟收數。</p>
  <p class="deck-meta" id="deckMeta"></p>
  <button type="button" class="big-btn" id="startBtn">開始撐</button>
  <noscript><p>此遊戲需要 JavaScript。</p></noscript>
</section>

<main id="game" class="screen" hidden>
  <div class="meters" id="meters" aria-label="四條橫條">
    <div class="meter" data-stat="brain"><span class="m-label">腦力</span><div class="m-track"><i id="mBrain"></i></div></div>
    <div class="meter" data-stat="time"><span class="m-label">時間</span><div class="m-track"><i id="mTime"></i></div></div>
    <div class="meter" data-stat="score"><span class="m-label">分數</span><div class="m-track"><i id="mScore"></i></div></div>
    <div class="meter" data-stat="mood"><span class="m-label">心情</span><div class="m-track"><i id="mMood"></i></div></div>
  </div>
  <div class="urgent-ring" id="urgentRing" hidden>
    <svg viewBox="0 0 36 36" aria-hidden="true">
      <circle class="ring-bg" cx="18" cy="18" r="15.5"></circle>
      <circle class="ring-fg" id="ringFg" cx="18" cy="18" r="15.5"></circle>
    </svg>
    <span id="urgentSec">3</span>
  </div>
  <div id="stackWrap">
    <div id="stack" aria-live="polite"></div>
  </div>
</main>

<section id="death" class="screen" hidden>
  <p class="death-days" id="deathDays"></p>
  <p class="death-cause" id="deathCause"></p>
  <p class="death-formula" id="deathFormula" hidden></p>
  <p class="death-correct" id="deathCorrect"></p>
  <button type="button" class="big-btn" id="againBtn">再撐一次</button>
  <button type="button" class="ghost-btn" id="homeBtn">返主頁</button>
</section>

<footer class="actions" id="actions" hidden>
  <button type="button" class="ans-btn left" id="btnLeft"><span class="mark">←</span> <span id="btnLeftLabel">左</span></button>
  <button type="button" class="ans-btn right" id="btnRight"><span id="btnRightLabel">右</span> <span class="mark">→</span></button>
</footer>

  </symbol>
