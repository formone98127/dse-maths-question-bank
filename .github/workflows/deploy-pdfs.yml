name: Deploy PDF library to Hostinger

# 把 deploy_manifest.tsv 列出的試卷 PDF（源：roothk.org 公開檔案）上傳到主機 /papers/<科目>/。
# 為什麼唔入 git：全部 896 個檔約 6.6GB，遠超 repo 與單檔限制。
# 觸發：手動（Actions → Run workflow）或 manifest 更新 push。

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "只處理前 N 個檔（0 = 全部，用於測試）"
        default: "0"
      only_kind:
        description: "只上傳某類型（paper/ms/report/mock，空白 = 全部）"
        default: ""
  push:
    branches: [main]
    paths:
      - "deploy_manifest.tsv"
      - ".github/workflows/deploy-pdfs.yml"

concurrency:
  group: pdf-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_HOST: 147.93.109.152
      FTP_USER: u187459660.hkdseupload
      SITE: https://hkdse.exampaper.cloud
    steps:
      - uses: actions/checkout@v4

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Fetch + upload PDFs
        env:
          FTP_PASS: ${{ secrets.HKDSE_FTP_PASSWORD }}
          LIMIT: ${{ github.event.inputs.limit || '0' }}
          ONLY_KIND: ${{ github.event.inputs.only_kind || '' }}
        run: |
          set -uo pipefail
          [ -z "${FTP_PASS:-}" ] && { echo "Missing secret HKDSE_FTP_PASSWORD"; exit 1; }
          python3 - <<'PY'
          import os, pathlib, subprocess, sys, time

          manifest = [l.rstrip('\n').split('\t') for l in open('deploy_manifest.tsv', encoding='utf-8') if l.strip()]
          limit = int(os.environ.get('LIMIT') or 0)
          only_kind = (os.environ.get('ONLY_KIND') or '').strip()
          if only_kind:
              manifest = [m for m in manifest if f'-{only_kind}-' in m[1]]
          if limit:
              manifest = manifest[:limit]
          print(f'to deploy: {len(manifest)}')

          host, user, pw = os.environ['FTP_HOST'], os.environ['FTP_USER'], os.environ['FTP_PASS']
          tmp = pathlib.Path('/tmp/dl'); tmp.mkdir(exist_ok=True)

          def lftp(lines):
              p = pathlib.Path('/tmp/lftp.cmd')
              p.write_text('\n'.join([
                  'set ssl:verify-certificate no', 'set ftp:ssl-force true',
                  'set ftp:ssl-protect-data true', 'set net:max-retries 4',
                  'set net:reconnect-interval-base 5', 'set net:timeout 120',
                  'set ftp:passive-mode true',
                  f'open -u "{user}","{pw}" ftp://{host}',
              ] + lines + ['bye', '']), encoding='utf-8')
              p.chmod(0o600)
              return subprocess.run(['lftp', '-f', str(p)], capture_output=True, text=True)

          ok = fail = skip = 0
          for i, (src, dst) in enumerate(manifest, 1):
              local = tmp / 'f.pdf'
              try:
                  r = subprocess.run(['curl', '-sL', '--max-time', '180', '-A', 'Mozilla/5.0', src, '-o', str(local)],
                                     capture_output=True)
                  if not local.exists() or local.stat().st_size < 8000:
                      print(f'[{i}] SKIP download-failed {src[:80]}'); skip += 1; continue
                  d = os.path.dirname(dst)
                  res = lftp([f'mkdir -p "/{d}"', f'put "{local}" -o "/{dst}"'])
                  if res.returncode != 0 or 'Error' in (res.stderr or ''):
                      print(f'[{i}] FAIL {dst}: {(res.stderr or "")[:120]}'); fail += 1
                  else:
                      ok += 1
                      if i % 25 == 0: print(f'[{i}/{len(manifest)}] ok={ok} fail={fail} skip={skip}')
              except Exception as e:
                  print(f'[{i}] ERR {e}'); fail += 1
              finally:
                  local.unlink(missing_ok=True)
          print(f'DONE ok={ok} fail={fail} skip={skip}')
          if fail and not ok:
              sys.exit(1)
          PY

      - name: Verify a sample
        run: |
          set -uo pipefail
          ok=0; total=0
          for f in $(shuf -n 8 deploy_manifest.tsv | cut -f2); do
            total=$((total+1))
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE/$f")
            echo "$code  /$f"
            [ "$code" = "200" ] && ok=$((ok+1)) || sleep 20
          done
          echo "verified $ok/$total"
